plugins {
    id 'java'
    id 'io.qameta.allure' version '2.11.2'
}

group = 'qa.openfoodfacts'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

def allureVersion = '2.21.0',
    appiumJavaClientVersion = '8.3.0',
    assertJVersion = '3.24.2',
    jacksonVersion = '2.14.2',
    junitVersion = '5.9.2',
    lombokVersion = '1.18.46',
    ownerVersion = '1.0.12',
    restAssuredVersion = '5.3.0',
    selenideVersion = '6.12.4',
    slf4jVersion = '2.0.6',
    webDriverManagerVersion = '5.9.3'

allure {
    report {
        version.set(allureVersion)
    }
    adapter {
        aspectjWeaver.set(true)
        frameworks {
            junit5 {
                adapterVersion.set(allureVersion)
            }
        }
    }
}

dependencies {
    testImplementation(
            "com.codeborne:selenide:$selenideVersion",
            "io.appium:java-client:$appiumJavaClientVersion",
            "io.qameta.allure:allure-junit5:$allureVersion",
            "io.qameta.allure:allure-rest-assured:$allureVersion",
            "io.qameta.allure:allure-selenide:$allureVersion",
            "io.rest-assured:rest-assured:$restAssuredVersion",
            "org.aeonbits.owner:owner:$ownerVersion",
            "org.assertj:assertj-core:$assertJVersion",
            "org.junit.jupiter:junit-jupiter:$junitVersion",
            "com.fasterxml.jackson.core:jackson-databind:$jacksonVersion",
            "io.github.bonigarcia:webdrivermanager:$webDriverManagerVersion",
            "org.slf4j:slf4j-simple:$slf4jVersion"
    )

    testCompileOnly "org.projectlombok:lombok:$lombokVersion"
    testAnnotationProcessor "org.projectlombok:lombok:$lombokVersion"
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    systemProperties(System.getProperties())
    jvmArgs '-Djava.net.preferIPv4Stack=true', '-Djdk.tls.client.protocols=TLSv1.2'

    testLogging {
        events 'started', 'passed', 'skipped', 'failed'
        exceptionFormat 'short'
    }
}

tasks.register('ui_test', Test) {
    description = 'Runs only UI tests'
    group = 'verification'

    useJUnitPlatform {
        includeTags 'ui'
    }
}

tasks.register('api_test', Test) {
    description = 'Runs only API tests'
    group = 'verification'

    useJUnitPlatform {
        includeTags 'api'
    }
}

tasks.register('mobile_test', Test) {
    description = 'Runs only Android mobile tests'
    group = 'verification'

    systemProperty 'runMobile', 'true'
    useJUnitPlatform {
        includeTags 'mobile'
    }
}
